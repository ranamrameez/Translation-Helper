<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Translation Helper</title>
  <script src="./site-navbar.js" defer></script>
  <script src="./translation-helper.js" defer></script>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; color: #f8fafc; background: #060913; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 15% 5%, #10302e, transparent 45%), radial-gradient(ellipse at 88% 12%, #211d48, transparent 45%); }
    main { max-width: 1220px; margin: auto; padding: 24px clamp(14px, 3vw, 32px); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.65rem, 4vw, 2.5rem); }
    h2 { font-size: 1.1rem; }
    p, label { color: #aab8ca; }
    .panel { background: #0f172ae8; border: 1px solid #2c3a52; border-radius: 16px; padding: 18px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 16px 0 10px; }
    button, select, textarea { font: inherit; color: inherit; background: #1b2941; border: 1px solid #455774; border-radius: 8px; padding: 7px 10px; }
    button { cursor: pointer; }
    button:hover, .primary { background: #16453f; border-color: #5eead4; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 2px solid #7dd3fc; outline-offset: 3px; }
    .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .editor { display: flex; flex-direction: column; min-width: 0; gap: 10px; }
    textarea { width: 100%; min-height: 290px; resize: vertical; background: #060913; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #status { min-height: 1.5em; }
    @media (max-width: 680px) { .editors { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <site-navbar page="home"></site-navbar>
  <main>
    <form id="translation">
      <header class="panel">
        <h1>Translation Helper</h1>
        <div class="controls">
          <label>From <select id="source" required></select></label>
          <label>To <select id="target" required></select></label>
          <label>Provider
            <select id="provider">
              <option value="auto">Automatic fallback</option>
              <option value="device">On-device only</option>
              <option value="memory">MyMemory</option>
              <option value="apertium">Apertium</option>
            </select>
          </label>
          <button id="swap" type="button">Swap languages</button>
          <button class="primary" id="translate" type="submit">Translate</button>
        </div>
        <p>Automatic mode tries on-device translation, MyMemory, then Apertium. Online providers receive the text you submit. Apertium supports selected language pairs.</p>
        <p id="status" role="status" aria-live="polite"></p>
      </header>
      <div class="editors">
        <section class="panel editor">
          <h2><label for="input">Input text</label></h2>
          <textarea id="input" dir="auto" required placeholder="Type or paste text"></textarea>
          <div class="actions">
            <button id="paste" type="button">Paste</button>
            <button id="append" type="button">Append clipboard</button>
            <button id="clear" type="button">Clear</button>
          </div>
        </section>
        <section class="panel editor">
          <h2><label for="output">Translation</label></h2>
          <textarea id="output" dir="auto" readonly placeholder="Your translation will appear here"></textarea>
          <div class="actions"><button id="copy" type="button" disabled>Copy translation</button></div>
        </section>
      </div>
    </form>
  </main>
</body>
</html>
